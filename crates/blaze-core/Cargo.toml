[package]
name = "blaze-core"
description = "Platform-independent core of Blaze IDE: project sandbox, files, search, terminal, BlazeAPI auth and AI streaming."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
dirs = "5"
dunce = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
notify = "6"
portable-pty = "0.8"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process"] }
tokio-util = "0.7"
trash = "5"
url = "2"
# Reads .vsix packages. 9.x: earlier releases have path/extract advisories.
zip = { version = "9", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
