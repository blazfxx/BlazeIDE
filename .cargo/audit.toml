# Accepted advisories (reviewed 2026-10-23). Re-check when tauri-plugin-updater moves to zip >= 9.
[advisories]
ignore = [
  # zip 4.6.1 is pulled in only by tauri-plugin-updater for Windows. All three are about
  # ZipArchive::extract on attacker-supplied archives. Blaze IDE's updater installs the NSIS
  # .exe and only after its minisign signature verified against our key, so no untrusted
  # archive is ever extracted. No fixed release of the plugin exists yet.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
